[project]
name = "geospatial-measurement-api"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are meant to be used as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs the PostGIS test database (run `docker compose up -d`); skip with -m \"not db\"",
]
